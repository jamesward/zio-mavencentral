on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'sbt'

    - run: ./sbt testFull
